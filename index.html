<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class=side-note>
            <div class="gaps">
                    <div class="dashy giddy">
                        <img src="./icons/view-dashboard.svg" alt="" class="dasi dash">
                        <p>Dashboard</p>
                    </div>
                    
                    <ul>
                        <li><div class="dashy">
                            <img src="./icons/home.svg" alt="home" class="dash">
                            <p>Home</p>
                        </div></li>
                        <li><div class="dashy">
                            <img src="./icons/card-account-details.svg" alt="Profile" class="dash">
                            <p>Profile</p> 
                            </div>
                        </li>
                        <li><div class="dashy">
                            <img src="./icons/message.svg" alt="Profile" class="dash">
                            <p>Messages</p> 
                            </div>
                        </li>
                        <li><div class="dashy">
                            <img src="./icons/clock-time-three.svg" alt="Profile" class="dash">
                            <p>History</p> 
                            </div>
                        </li>
                        <li><div class="dashy">
                            <img src="./icons/file-multiple.svg" alt="Profile" class="dash">
                            <p>Tasks</p> 
                            </div>
                        </li>
                        <li><div class="dashy">
                            <img src="./icons/account-group.svg" alt="Profile" class="dash">
                            <p>Communities</p> 
                            </div>
                        </li>
                    </ul>

                    <div>
                        <ul>
                            <li><div class="dashy">
                                <img src="./icons/cog.svg" alt="Profile" class="dash">
                                <p>Settings</p> 
                                </div>
                            </li>
                            <li><div class="dashy">
                                <img src="./icons/help-box.svg" alt="Profile" class="dash">
                                <p>Support</p> 
                                </div>
                            </li>
                            <li><div class="dashy">
                                <img src="./icons/shield-check.svg" alt="Profile" class="dash">
                                <p>Privacy</p> 
                                </div>
                            </li>
                        </ul>
                    </div>
            </div>
            <div class="nou"></div>
         </div>
        <div class="header">
            <div class="head-one">
                <div class="row-one">
                    <div class="search">
                        <div><img src="./icons/magnify.svg" alt="search" class="many" ></div>
                        <div><input type="search" name="" id=""  ></div>
                    </div>
                    <div class="bell">
                        <div><img src="./icons/bell-ring-outline.svg" alt="notifications" class="many"></div>
                        <div class="profile">
                            <img src="./images/profile.jpeg" alt="profile" class="photo-1">
                        </div>
                    </div>
                </div>
                <div class="row-two"></div>
            </div>
        </div>
        <div class="main"></div>
        
    </div>
</body>
</html>
